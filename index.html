<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171c19">
    <meta name="description" content="Демо-макет записи в студию автодетейлинга АвтоБлеск.">
    <title>АвтоБлеск — автодетейлинг</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header class="site-header" id="top">
      <div class="header-inner page-width">
        <a class="brand" href="#top" aria-label="АвтоБлеск — на главную">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M7 29.5h34l-3.4-9.3a4 4 0 0 0-3.8-2.6H14.2a4 4 0 0 0-3.8 2.6L7 29.5Z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
              <path d="M5.5 29.5v7.2a2.3 2.3 0 0 0 2.3 2.3h2.4v-4h27.6v4h2.4a2.3 2.3 0 0 0 2.3-2.3v-7.2" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
              <circle cx="15" cy="30.2" r="2.1" fill="currentColor"/><circle cx="33" cy="30.2" r="2.1" fill="currentColor"/>
              <path d="M16 23h16M22 7l-4 7h6l-2 6 9-9h-6l2-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="brand-type"><strong>АвтоБлеск</strong><span>автодетейлинг</span></span>
        </a>
        <div class="header-actions">
          <div class="mode-switch" role="group" aria-label="Раздел приложения">
            <button type="button" class="mode-button is-active" data-mode="client">Клиент</button>
            <button type="button" class="mode-button" data-mode="owner">Кабинет</button>
          </div>
          <button class="icon-button theme-button" type="button" data-theme-toggle aria-label="Переключить тему" title="Переключить тему">
            <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.2 8.2 0 0 1 9.8 3.5 8.6 8.6 0 1 0 20.5 14.2Z"/><path d="M16.4 3.4v4.2m-2.1-2.1h4.2"/></svg>
          </button>
          <button class="icon-button install-button" type="button" data-install hidden aria-label="Установить приложение" title="Установить приложение">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 16v4h14v-4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="page-width main-content" tabindex="-1">
      <div id="app" aria-live="off"></div>
    </main>

    <footer class="site-footer">
      <div class="page-width footer-inner">
        <span>АвтоБлеск · учебный макет</span>
        <span>Заявки хранятся только в этом браузере</span>
        <a href="#top">Наверх ↑</a>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <dialog class="move-dialog" id="move-dialog" aria-labelledby="move-title">
      <form id="move-form" method="dialog">
        <div class="dialog-heading">
          <div><span class="eyebrow">Календарь постов</span><h2 id="move-title">Перенести заявку</h2></div>
          <button type="button" class="icon-button" data-close-dialog aria-label="Закрыть">×</button>
        </div>
        <input type="hidden" name="orderId">
        <label>Дата<input type="date" name="date" required></label>
        <label>Время<select name="time" required><option value="10:00">10:00</option><option value="13:00">13:00</option><option value="16:00">16:00</option><option value="18:00">18:00</option></select></label>
        <label>Пост<select name="post" required><option value="Пост 1">Пост 1</option><option value="Пост 2">Пост 2</option><option value="Пост 3">Пост 3</option></select></label>
        <button class="button button-primary" type="submit">Сохранить новое время</button>
      </form>
    </dialog>

    <script src="./app.js" defer></script>
  </body>
</html>
